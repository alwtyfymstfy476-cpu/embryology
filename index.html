<!DOCTYPE html>

    <style>
        /* إعدادات الألوان والخلفية المريحة للعين */
        :root {

            padding: 0;

            font-family: 'Cairo', sans-serif;
            color: var(--primary-dark);
            overflow-x: hidden;

        /* تنسيق اسم العلامة التجارية */
        .brand-name {

            font-size: 2.5rem;
            color: var(--accent-color);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);

        }

        #view-menu {
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .menu-title {
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--primary-dark);
        }

        .menu-grid {
            display: grid;

            gap: 20px;
        }

        .menu-btn {
            background: #ffffff;
            border: 2px solid #eaeaea;
            border-radius: 15px;
            padding: 25px 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-dark);
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 12px 20px rgba(211, 84, 0, 0.15);
        }
        
        .course-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            background: #f1f2f6;

            border-radius: 20px;

            margin: 0 auto;

            padding: 10px 30px;

        .back-btn {
            background-color: var(--bg-creamy);

        }

        .score-board {

            font-weight: 700;
            background: #fff;
            padding: 5px 15px;
            border-radius: 10px;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
        }

        .top-bar .brand-name {
            font-size: 1.8rem;
            margin: 0;
        }

        .quiz-container {
            direction: ltr;
            text-align: left;
            font-family: 'Inter', sans-serif;
            padding: 0 20px;
        }

            font-family: 'Cairo', sans-serif;
            text-align: center;
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 30px;
            border-bottom: 3px dashed var(--accent-color);
            padding-bottom: 10px;

            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            border-left: 5px solid var(--primary-dark);
        }

            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #111;
        }

        .q-options {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .q-options li {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 18px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.05rem;
            color: #333;
        }

        .q-options li:hover:not(.answered) {
            background: #e2e6ea;
            border-color: #dae0e5;
        }

        /* حالات الإجابة */
        .q-options li.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .q-options li.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .q-options li.reveal-correct {
            background-color: var(--correct-bg) !important;
            border: 2px dashed var(--correct-border) !important;
            color: var(--correct-text) !important;
        }

        /* أنيميشن الإيموجيات */
        .emoji-pop {
            position: fixed;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
