<!DOCTYPE html>

    <style>
        /* إعدادات الألوان والخلفية المريحة للعين */
        :root {

            padding: 0;

            font-family: 'Cairo', sans-serif;
            color: var(--primary-dark);
            overflow-x: hidden;

        /* تنسيق اسم العلامة التجارية */
        .brand-name {

            font-size: 2.5rem;
            color: var(--accent-color);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);

        }

        #view-menu {
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .menu-title {
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--primary-dark);
        }

        .menu-grid {
            display: grid;

            gap: 20px;
        }

        .menu-btn {
            background: #ffffff;
            border: 2px solid #eaeaea;
            border-radius: 15px;
            padding: 25px 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-dark);
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 12px 20px rgba(211, 84, 0, 0.15);
        }
        
        .course-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            background: #f1f2f6;

            border-radius: 20px;

            margin: 0 auto;

            padding: 10px 30px;

        .back-btn {
            background-color: var(--bg-creamy);

        }

        .score-board {

            font-weight: 700;
            background: #fff;
            padding: 5px 15px;
            border-radius: 10px;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
        }

        .top-bar .brand-name {
            font-size: 1.8rem;
            margin: 0;
        }

        .quiz-container {
            direction: ltr;
            text-align: left;
            font-family: 'Inter', sans-serif;
            padding: 0 20px;
        }

            font-family: 'Cairo', sans-serif;
            text-align: center;
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 30px;
            border-bottom: 3px dashed var(--accent-color);
            padding-bottom: 10px;

            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: var(--card-shadow);
            border-left: 5px solid var(--primary-dark);
        }

            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #111;
        }

        .q-options {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .q-options li {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 18px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.05rem;
            color: #333;
        }

        .q-options li:hover:not(.answered) {
            background: #e2e6ea;
            border-color: #dae0e5;
        }

        /* حالات الإجابة */
        .q-options li.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .q-options li.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .q-options li.reveal-correct {
            background-color: var(--correct-bg) !important;
            border: 2px dashed var(--correct-border) !important;
            color: var(--correct-text) !important;
        }

        /* أنيميشن الإيموجيات */
        .emoji-pop {
            position: fixed;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

        // =========================================================================
        // 2. إعدادات الصوت التفاعلي
        // =========================================================================
        function playSound(isCorrect) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (isCorrect) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        // =========================================================================
        // 3. الإيموجيات التفاعلية
        // =========================================================================
        function popEmojis(isCorrect, eventX, eventY) {
            const corrects = ['🎉', '✨', '👏', '🌟', '🏆', '🔥', '✅', '💯'];
            const wrongs = ['❌', '😔', '💔', '😥', '🤦', '🥀', '👎', '⚠️'];
            const arr = isCorrect ? corrects : wrongs;
            
            for (let i = 0; i < 6; i++) {
                const em = document.createElement('div');
                em.className = 'emoji-pop';
                em.innerText = arr[Math.floor(Math.random() * arr.length)];
                
                const offsetX = (Math.random() - 0.5) * 100;
                const offsetY = (Math.random() - 0.5) * 100;
                em.style.left = `calc(${eventX}px + ${offsetX}px)`;
                em.style.top = `calc(${eventY}px + ${offsetY}px)`;
                em.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(em);

                let op = 1;
                let moveY = 0;
                const interval = setInterval(() => {
                    moveY -= 2;
                    op -= 0.02;
                    em.style.transform = `translateY(${moveY}px) scale(${1 + (1-op)})`;
                    em.style.opacity = op;
                    if (op <= 0) {
                        clearInterval(interval);
                        em.remove();
                    }
                }, 16);
            }
        }

        // =========================================================================
        // 4. التحكم في التطبيق (Navigation & Logic)
        // =========================================================================
        let currentScore = 0;
        let totalQuestionsForCurrent = 0;

        const targetOrder = [
            { c: 'Course 1', l: 'Lecture 3' },
            { c: 'Course 1', l: 'Lecture 4' },
            { c: 'Course 1', l: 'Lecture 5' },
            { c: 'Course 1', l: 'Lectures 6&7' },
            { c: 'Course 2', l: 'Lecture 1' },
            { c: 'Course 2', l: 'Lecture 2' },
            { c: 'Course 2', l: 'Lecture 3' }
        ];

        function initMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            
            targetOrder.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'menu-btn';
                btn.innerHTML = `<span class="course-label">${item.c}</span> ${item.l}`;
                btn.onclick = () => startQuiz(item.c, item.l);
                grid.appendChild(btn);
            });
        }

        function goHome() {
            document.getElementById('view-quiz').style.display = 'none';
            document.getElementById('view-menu').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function updateScoreBoard() {
            document.getElementById('score-board').innerText = `النتيجة: ${currentScore} / ${totalQuestionsForCurrent}`;
        }

        function startQuiz(course, lecture) {
            document.getElementById('view-menu').style.display = 'none';
            document.getElementById('view-quiz').style.display = 'block';
            
            document.getElementById('current-lecture-title').innerText = `${course} - ${lecture}`;
            
            const wrapper = document.getElementById('questions-wrapper');
            wrapper.innerHTML = '';
            
            const questions = quizData[course][lecture];
            currentScore = 0;
            totalQuestionsForCurrent = questions.length;
            updateScoreBoard();
            
            questions.forEach((qData) => {
                const qBlock = document.createElement('div');
                qBlock.className = 'q-block';
                
                const qText = document.createElement('div');
                qText.className = 'q-text';
                qText.innerText = qData.q;
                qBlock.appendChild(qText);
                
                const optList = document.createElement('ul');
                optList.className = 'q-options';
                
                let answered = false;
                
                // الحل البرمجي: أخذ الحرف الصحيح بدقة من قاعدة البيانات
                const correctLetter = qData.ans.trim().toUpperCase();

                qData.opts.forEach(opt => {
                    const li = document.createElement('li');
                    li.innerText = opt;
                    
                    li.onclick = (e) => {
                        if (answered) return;
                        answered = true;
                        
                        // استخراج حرف الخيار الذي ضغط عليه المستخدم بأمان
                        let optLetter = null;
                        const match = opt.match(/([A-E])\./i);
                        if(match) {
                            optLetter = match[1].toUpperCase();
                        }
                        
                        if (optLetter === correctLetter) {
                            li.classList.add('correct');
                            currentScore++;
                            playSound(true);
                            popEmojis(true, e.clientX, e.clientY);
                        } else {
                            li.classList.add('wrong');
                            playSound(false);
                            popEmojis(false, e.clientX, e.clientY);
                            
                            // كشف الإجابة الصحيحة
                            Array.from(optList.children).forEach(child => {
                                const cMatch = child.innerText.match(/([A-E])\./i);
                                if (cMatch && cMatch[1].toUpperCase() === correctLetter) {
                                    child.classList.add('reveal-correct');
                                }
                            });
                        }
                        
                        Array.from(optList.children).forEach(c => c.classList.add('answered'));
                        updateScoreBoard();
                    };
                    
                    optList.appendChild(li);
                });
                
                qBlock.appendChild(optList);
                wrapper.appendChild(qBlock);
            });
            
            window.scrollTo(0, 0);
        }

        window.onload = initMenu;

    </script>
